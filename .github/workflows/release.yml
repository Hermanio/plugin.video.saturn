name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: ./run-tests.sh
      - run: ./package.sh
      - name: Publish the zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="dist/plugin.video.saturn-${GITHUB_REF_NAME#v}.zip"
          test -f "$zip" || { echo "tag $GITHUB_REF_NAME does not match addon.xml"; exit 1; }
          notes="$(sed -n 's:.*<news>\(.*\)</news>.*:\1:p' addon.xml)"
          gh release create "$GITHUB_REF_NAME" "$zip" \
            --title "Saturn ${GITHUB_REF_NAME#v}" --notes "$notes"
